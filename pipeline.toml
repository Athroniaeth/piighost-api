# pipeline.toml, the server's default piighost configuration.
#
# Every regex group of the piighost hub (https://hub.piighost.dev), 140 labels:
# secrets and machine identifiers, the identifiers of 26 countries, identity
# documents, company, health and payment numbers, crypto wallets, and the
# international shapes (email, URL, IP, phone, card). Each reference is pinned
# to a commit, fetched on the first start and read from the disk cache after.
# Labels shared by several groups carry the same pattern in each.
#
# The order breaks a tie between two patterns on one span: the first named
# wins. Secrets, identity documents, company and health numbers come first,
# the country groups next, whose phone patterns are loose, and the generic
# shapes (card, phone, email) last. Where two patterns overlap without a tie,
# the merge resolver below names the union after the widest.
#
# Regex only: the server starts with no model and no extra. For names,
# addresses and organizations, add a model detector (see the commented block
# at the end) and install piighost-api[gliner2].
#
# PIIGHOST_CONFIG can name a hub configuration instead of this file, such as
# hub:piighost/support-en:286909f6 or hub:piighost/fr-notarial:2f602547.

name = "piighost-api-default"

[detector]
type = "regex"
catalogs = [
    "hub:piighost/logs:b635d867",
    "hub:piighost/identity-documents:08c163eb",
    "hub:piighost/business:8be59133",
    "hub:piighost/health:da8fa4c6",
    "hub:piighost/us-extended:b82939c9",
    "hub:piighost/us-health:596ed9cd",
    "hub:piighost/fr-extended:0af72c1b",
    "hub:piighost/be:bb239203",
    "hub:piighost/ch:4aa0f6aa",
    "hub:piighost/de:74eb9f4c",
    "hub:piighost/at:29bc939d",
    "hub:piighost/it:6af7753b",
    "hub:piighost/es:3980052d",
    "hub:piighost/pt:bd45b050",
    "hub:piighost/nl:3a7cf0f0",
    "hub:piighost/ie:f01a1f54",
    "hub:piighost/dk:6ac36560",
    "hub:piighost/se:990ac59e",
    "hub:piighost/fi:47437c04",
    "hub:piighost/pl:14c2e033",
    "hub:piighost/uk:7d4e3595",
    "hub:piighost/ca:5330fd7a",
    "hub:piighost/mx:aeb1db74",
    "hub:piighost/br:b48c945f",
    "hub:piighost/ar:c9a7281a",
    "hub:piighost/cl:2b58b122",
    "hub:piighost/au:193c78b4",
    "hub:piighost/in:ac86dc1b",
    "hub:piighost/id:055741a8",
    "hub:piighost/jp:8bba9c31",
    "hub:piighost/kr:2ee42d25",
    "hub:piighost/sg:12c80121",
    "hub:piighost/payment:b1b1cd64",
    "hub:piighost/crypto:8a80c367",
    "hub:piighost/international:5fd947ca",
]

# Where two patterns overlap, hide the union rather than keep one and leave
# the rest of the value in clear.
[overlap_resolver]
type = "merge"

# Find the other occurrences of every detected value in the message.
[expander]
type = "word_boundary"

[linker]
type = "exact"

[anonymizer.placeholder]
type = "label_counter"

# One process keeps the threads. For several workers, swap for a redis memory
# with a hasher and a cipher, which then needs PIIGHOST_HASH_PEPPER and
# PIIGHOST_CIPHER_KEY in the environment.
[memory]
type = "in_memory"

# With a model, replace [detector] above by:
#
# [detector]
# type = "composite"
#
# [[detector.detectors]]
# type = "gliner2"
# model = "fastino/gliner2-multi-v1"
# labels = ["PERSON", "ADDRESS", "ORGANIZATION"]
# max_chars = 2000
#
# [[detector.detectors]]
# type = "regex"
# catalogs = [ ...the same list... ]
