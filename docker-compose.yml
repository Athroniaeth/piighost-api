services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    environment:
      - PIIGHOST_CONFIG=${PIIGHOST_CONFIG:-/app/pipeline.toml}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SECRET_PEPPER=${SECRET_PEPPER}
      - API_KEY_default=${API_KEY}
      - PIIGHOST_ALLOW_ANONYMOUS=${PIIGHOST_ALLOW_ANONYMOUS:-}
      - PIIGHOST_MAX_BODY_BYTES=${PIIGHOST_MAX_BODY_BYTES:-1000000}
      - PIIGHOST_RATE_LIMIT=${PIIGHOST_RATE_LIMIT:-}
      - PIIGHOST_OPENAI_UPSTREAM=${PIIGHOST_OPENAI_UPSTREAM:-https://api.openai.com/v1}
      - PIIGHOST_ANTHROPIC_UPSTREAM=${PIIGHOST_ANTHROPIC_UPSTREAM:-https://api.anthropic.com/v1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - EXTRA_PACKAGES=${EXTRA_PACKAGES:-}
    volumes:
      - ./pipeline.toml:/app/pipeline.toml
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      - redis

  # Only used by a configuration declaring a redis memory, whose url points
  # at redis://redis:6379.
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  huggingface-cache:
